
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#111827;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#38bdf8;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;--input:#0b1220}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}.wrap{max-width:1220px;margin:0 auto}.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:24px;margin:0;color:var(--blue)}h2{font-size:17px;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px}h3{font-size:15px;margin:18px 0 12px;color:var(--blue);text-transform:uppercase}label{display:block;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:5px}select,input,textarea{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);padding:9px 10px;font-size:15px}textarea{min-height:70px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.muted{color:var(--muted);font-size:13px;line-height:1.4}.status{display:block;padding:10px;border-radius:10px;background:#0b1220;border:1px solid var(--border);font-weight:800;margin-top:12px}.ok{color:#34d399}.err{color:#f87171}.warn{color:#fbbf24}button{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer;color:white;font-size:13px}.btn{background:#475569}.btn:hover{background:#64748b}.save{background:#2563eb}.green{background:var(--green)}.red{background:var(--red)}.yellow{background:var(--yellow);color:#111827}.table-responsive{width:100%;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-top:10px}table{width:100%;min-width:820px;border-collapse:collapse;background:var(--card2)}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:center;color:var(--text)}th{position:sticky;top:0;background:#0b1220;color:var(--muted);font-size:11px;text-transform:uppercase;z-index:2}td.left{text-align:left}.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.daychips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--muted);font-weight:900;cursor:pointer}.chip input{display:none}.chip.checked{background:#0284c7;color:#fff;border-color:#0369a1}@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}body{padding:10px}.box{padding:12px}table{min-width:760px}}
</style>

<title>Konfiguracja przerw</title>
</head><body><div class="wrap">
<div class="box topbar"><div><h1>⏱️ Konfiguracja przerw</h1><div class="muted">Osobna podstrona harmonogramu przerw. Po zakończeniu pracy kliknij „Wróć do panelu”.</div></div><button class="btn" onclick="window.location.href='panel.html'">← Wróć do panelu</button></div>
<div class="box"><div class="topbar"><h2>Harmonogram</h2><div class="actions"><button class="green" onclick="addBreakRow()">+ Dodaj przerwę</button><button class="yellow" onclick="restoreDefaults()">Domyślne</button><button class="save" onclick="saveBreakSchedule()">Zapisz w bazie</button></div></div><div class="grid"><div><label>Odświeżanie TV co ile minut</label><input type="number" id="breakRefreshMinutes" min="1" max="60" value="5"></div><div class="muted">Typ „6S” jest potem widoczny na podstronie config_6s.html jako przerwa, do której przypisujesz zadania.</div></div><div id="breakRows"></div><div id="status" class="status">Status: —</div></div>
</div><script>
const SUPABASE_URL='https://vyobsgknuxxlglkyhulb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_n6qmH_g5BMxbzxxz5KDp3A_W0k80d7L';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const KEY='gema_break_schedule_config_v2';
const DEFAULT=[{start:'05:45',durationMinutes:15,kind:'6S',shift:'1',soundType:'chime',title:'CZAS 6S',subtitle:'Sprzątanie / porządki — do końca pozostało:',days:[1,2,3,4,5],enabled:true},{start:'09:30',durationMinutes:30,kind:'main',shift:'1',soundType:'siren',title:'PRZERWA',subtitle:'Do końca przerwy pozostało:',days:[1,2,3,4,5],enabled:true},{start:'13:45',durationMinutes:15,kind:'6S',shift:'2',soundType:'chime',title:'CZAS 6S',subtitle:'Sprzątanie / porządki — do końca pozostało:',days:[1,2,3,4,5],enabled:true},{start:'17:30',durationMinutes:30,kind:'main',shift:'2',soundType:'siren',title:'PRZERWA',subtitle:'Do końca przerwy pozostało:',days:[1,2,3,4,5],enabled:true},{start:'21:45',durationMinutes:15,kind:'6S',shift:'3',soundType:'chime',title:'CZAS 6S',subtitle:'Sprzątanie / porządki — do końca pozostało:',days:[1,2,3,4,5],enabled:true}];
let SCHEDULE=[];
function escapeHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dayName(d){return ['Nd','Pn','Wt','Śr','Cz','Pt','Sb'][d]||'?'}
function normalize(item){const n=Object.assign({start:'09:30',durationMinutes:15,kind:'main',shift:'1',soundType:'siren',title:'PRZERWA',subtitle:'Do końca przerwy pozostało:',days:[1,2,3,4,5],enabled:true,customSoundUrl:'',customSoundName:''},item||{});n.kind=n.kind==='6S'?'6S':'main';n.durationMinutes=Math.max(1,Math.min(240,parseInt(n.durationMinutes,10)||15));n.shift=['1','2','3','all'].includes(String(n.shift))?String(n.shift):'1';n.soundType=['siren','chime','double','beep','none','custom'].includes(String(n.soundType))?String(n.soundType):(n.kind==='6S'?'chime':'siren');n.days=Array.isArray(n.days)?n.days.map(Number).filter(d=>d>=0&&d<=6):[1,2,3,4,5];if(!n.days.length)n.days=[1,2,3,4,5];n.enabled=n.enabled!==false;return n}
function msg(m,e=false){const s=document.getElementById('status');s.className='status '+(e?'err':'ok');s.textContent=m}
async function loadSchedule(){try{const{data,error}=await supabaseClient.from('break_schedule_config').select('schedule,refresh_minutes').eq('id',1).single();if(error)throw error;if(data&&Array.isArray(data.schedule)){SCHEDULE=data.schedule.map(normalize);document.getElementById('breakRefreshMinutes').value=data.refresh_minutes||5;localStorage.setItem(KEY,JSON.stringify(SCHEDULE));return}}catch(e){try{const local=JSON.parse(localStorage.getItem(KEY)||'[]');SCHEDULE=local.length?local.map(normalize):DEFAULT.map(normalize)}catch(_e){SCHEDULE=DEFAULT.map(normalize)}}}
function render(){const c=document.getElementById('breakRows');c.innerHTML='';SCHEDULE.forEach((it,i)=>{const row=document.createElement('div');row.className='box';row.style.background='var(--card2)';row.innerHTML=`<div class="grid3"><div><label>Start</label><input type="time" value="${escapeHtml(it.start)}" onchange="upd(${i},'start',this.value)"></div><div><label>Czas min</label><input type="number" min="1" max="240" value="${it.durationMinutes}" onchange="upd(${i},'durationMinutes',this.value)"></div><div><label>Zmiana</label><select onchange="upd(${i},'shift',this.value)"><option value="1" ${it.shift==='1'?'selected':''}>Zmiana 1</option><option value="2" ${it.shift==='2'?'selected':''}>Zmiana 2</option><option value="3" ${it.shift==='3'?'selected':''}>Zmiana 3</option><option value="all" ${it.shift==='all'?'selected':''}>Wszystkie</option></select></div><div><label>Typ</label><select onchange="updKind(${i},this.value)"><option value="main" ${it.kind==='main'?'selected':''}>Przerwa</option><option value="6S" ${it.kind==='6S'?'selected':''}>6S</option></select></div><div><label>Dźwięk</label><select onchange="upd(${i},'soundType',this.value)"><option value="siren" ${it.soundType==='siren'?'selected':''}>Syrena</option><option value="chime" ${it.soundType==='chime'?'selected':''}>Gong</option><option value="double" ${it.soundType==='double'?'selected':''}>Podwójny</option><option value="beep" ${it.soundType==='beep'?'selected':''}>Piknięcie</option><option value="custom" ${it.soundType==='custom'?'selected':''}>Własny</option><option value="none" ${it.soundType==='none'?'selected':''}>Brak</option></select></div><div><label>Aktywna</label><select onchange="upd(${i},'enabled',this.value==='true')"><option value="true" ${it.enabled?'selected':''}>Tak</option><option value="false" ${!it.enabled?'selected':''}>Nie</option></select></div></div><div class="grid" style="margin-top:10px"><div><label>Komunikat</label><input value="${escapeHtml(it.title)}" onchange="upd(${i},'title',this.value)"></div><div><label>Tekst pod spodem</label><input value="${escapeHtml(it.subtitle)}" onchange="upd(${i},'subtitle',this.value)"></div></div><div style="margin-top:10px"><label>Dni</label><div class="daychips">${[1,2,3,4,5,6,0].map(d=>`<label class="chip ${it.days.includes(d)?'checked':''}"><input type="checkbox" ${it.days.includes(d)?'checked':''} onchange="toggleDay(${i},${d},this.checked)">${dayName(d)}</label>`).join('')}</div></div><div class="actions" style="margin-top:12px;justify-content:flex-start"><button class="red" onclick="removeRow(${i})">Usuń</button></div>`;c.appendChild(row)})}
function upd(i,f,v){SCHEDULE[i][f]=v;SCHEDULE[i]=normalize(SCHEDULE[i]);render()}
function updKind(i,v){SCHEDULE[i].kind=v;if(v==='6S'&&(SCHEDULE[i].title==='PRZERWA'||!SCHEDULE[i].title)){SCHEDULE[i].title='CZAS 6S';SCHEDULE[i].subtitle='Sprzątanie / porządki — do końca pozostało:';SCHEDULE[i].soundType='chime'}SCHEDULE[i]=normalize(SCHEDULE[i]);render()}
function toggleDay(i,d,on){const arr=new Set(SCHEDULE[i].days);on?arr.add(d):arr.delete(d);SCHEDULE[i].days=Array.from(arr);SCHEDULE[i]=normalize(SCHEDULE[i]);render()}
function addBreakRow(){SCHEDULE.push(normalize({start:'10:00',durationMinutes:15,kind:'main',shift:'1',title:'PRZERWA',subtitle:'Do końca przerwy pozostało:',days:[1,2,3,4,5],enabled:true}));render();msg('Dodano nową przerwę. Uzupełnij dane i zapisz w bazie.')}
function removeRow(i){if(confirm('Usunąć tę pozycję harmonogramu?')){SCHEDULE.splice(i,1);render()}}
function restoreDefaults(){if(confirm('Przywrócić domyślny harmonogram?')){SCHEDULE=DEFAULT.map(normalize);render();msg('Przywrócono domyślne. Kliknij Zapisz w bazie.')}}
function sortSchedule(){return SCHEDULE.map(normalize).sort((a,b)=>String(a.shift||'1').localeCompare(String(b.shift||'1'))||String(a.start).localeCompare(String(b.start)))}
async function saveBreakSchedule(){SCHEDULE=sortSchedule();const refresh=Math.max(1,Math.min(60,parseInt(document.getElementById('breakRefreshMinutes').value,10)||5));localStorage.setItem(KEY,JSON.stringify(SCHEDULE));localStorage.setItem(KEY+'_refresh_minutes',String(refresh));const{error}=await supabaseClient.from('break_schedule_config').upsert({id:1,schedule:SCHEDULE,refresh_minutes:refresh,updated_at:new Date().toISOString()},{onConflict:'id'});if(error){msg('Błąd zapisu w Supabase: '+error.message,true);return}render();msg('Zapisano harmonogram przerw w Supabase.')}
async function init(){await loadSchedule();render();msg('Pobrano harmonogram.')}window.onload=init;
</script></body></html>
