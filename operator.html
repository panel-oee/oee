<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Odklikiwanie zadań 6S</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#111827;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#38bdf8;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}.wrap{max-width:920px;margin:0 auto}.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}h1{font-size:24px;margin:0 0 8px;color:var(--blue)}h2{font-size:17px;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:6px}select,input,textarea{width:100%;height:44px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);padding:10px;font-size:16px}textarea{height:72px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:var(--muted);font-size:13px;line-height:1.35}.status{padding:10px;border-radius:10px;background:#0b1220;border:1px solid var(--border);font-weight:800}.task{border:1px solid var(--border);background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}.task-title{font-size:17px;font-weight:900;margin-bottom:4px}.task-desc{font-size:13px;color:var(--muted);margin-bottom:10px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:0;border-radius:10px;padding:12px 10px;font-weight:900;cursor:pointer;color:white;font-size:14px}.done{background:var(--green)}.skipped{background:var(--yellow);color:#111827}.problem{background:var(--red)}.selected{outline:3px solid var(--blue);box-shadow:0 0 0 4px rgba(56,189,248,.15)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{border-radius:999px;padding:8px 10px;background:#0b1220;border:1px solid var(--border);text-align:center;font-weight:900}.save{width:100%;background:#2563eb;font-size:17px;margin-top:10px}.ok{color:#34d399}.warn{color:#fbbf24}.err{color:#f87171}@media(max-width:700px){.grid,.summary,.buttons{grid-template-columns:1fr}}
.assigned-note{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.35}.assigned-empty{border:1px dashed var(--border);border-radius:12px;padding:14px;background:#0b1220;color:var(--muted);line-height:1.4}.task-meta{font-size:12px;color:var(--muted);margin-top:2px}

</style></head><body><div class="wrap"><div class="box"><h1>Odklikiwanie zadań 6S</h1><div class="muted">Po wyborze operatora pokazują się tylko czynności 6S przypisane do tej osoby w konfiguracji 6S. Pole PIN jest przygotowane na przyszłość.</div></div><div class="box"><h2>Sesja i operator</h2><div class="grid"><div><label>Operator</label><select id="operatorSelect"></select></div><div><label>PIN - na przyszłość</label><input id="operatorPin" type="password" placeholder="Nieaktywne"></div><div><label>Data</label><input id="sessionDate" type="date"></div><div><label>Przerwa 6S z harmonogramu</label><select id="sessionSelect"></select></div></div><div id="sessionStatus" class="status" style="margin-top:12px">Ładowanie konfiguracji...</div></div><div class="box"><h2>Zadania 6S</h2><div class="summary"><div class="pill" id="sumDone">Wykonane: 0</div><div class="pill" id="sumSkipped">Pominięte: 0</div><div class="pill" id="sumProblem">Problem: 0</div></div><div id="tasksBox" style="margin-top:12px"></div><label>Uwagi do sesji / pominiętych zadań</label><textarea id="globalComment" placeholder="Opcjonalnie: dlaczego pominięto zadanie albo co wymaga reakcji"></textarea><button class="save" onclick="saveSixsLogs()">ZAPISZ ODLIKANIE 6S</button><div id="saveStatus" class="muted" style="margin-top:10px"></div></div></div><script>
const SUPABASE_URL='https://vyobsgknuxxlglkyhulb.supabase.co',SUPABASE_ANON_KEY='sb_publishable_n6qmH_g5BMxbzxxz5KDp3A_W0k80d7L',supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const BREAK_SCHEDULE_STORAGE_KEY='gema_break_schedule_config_v2';const DEFAULT_BREAK_SCHEDULE=[{start:'05:45',durationMinutes:15,kind:'6S',shift:'1',days:[1,2,3,4,5],enabled:true},{start:'13:45',durationMinutes:15,kind:'6S',shift:'2',days:[1,2,3,4,5],enabled:true},{start:'21:45',durationMinutes:15,kind:'6S',shift:'3',days:[1,2,3,4,5],enabled:true}];let BREAK_SCHEDULE=DEFAULT_BREAK_SCHEDULE,TASKS=[],OPERATORS=[],LOGS={};function pad(n){return String(n).padStart(2,'0')}function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dayNum(d){return d.getDay()}function minFromTime(t){const p=String(t||'00:00').split(':').map(Number);return(p[0]||0)*60+(p[1]||0)}function setStatus(m,c=''){const e=document.getElementById('sessionStatus');e.className='status '+c;e.textContent=m}function setSave(m,c=''){const e=document.getElementById('saveStatus');e.className='muted '+c;e.textContent=m}
function escHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function loadBreakSchedule(){try{const{data,error}=await supabaseClient.from('break_schedule_config').select('schedule').eq('id',1).single();if(error)throw error;if(data&&Array.isArray(data.schedule)){BREAK_SCHEDULE=data.schedule;localStorage.setItem(BREAK_SCHEDULE_STORAGE_KEY,JSON.stringify(BREAK_SCHEDULE));return}}catch(e){try{const local=JSON.parse(localStorage.getItem(BREAK_SCHEDULE_STORAGE_KEY)||'[]');if(local.length)BREAK_SCHEDULE=local}catch(_e){}}}
async function loadOperators(){const{data,error}=await supabaseClient.from('sixs_operators').select('*').eq('active',true).order('operator_name');if(error)throw error;OPERATORS=data||[];document.getElementById('operatorSelect').innerHTML=OPERATORS.map(o=>`<option value="${o.id}">${o.operator_name}</option>`).join('')}
function buildSessions(){const d=new Date(document.getElementById('sessionDate').value+'T00:00:00'),dow=dayNum(d);const sessions=BREAK_SCHEDULE.filter(x=>x.enabled!==false&&x.kind==='6S'&&Array.isArray(x.days)&&x.days.includes(dow)).sort((a,b)=>minFromTime(a.start)-minFromTime(b.start));const sel=document.getElementById('sessionSelect');sel.innerHTML=sessions.map(x=>`<option value="${x.shift||'all'}|${x.start}">Zmiana ${x.shift||'all'} / ${x.start} / ${x.durationMinutes||15} min</option>`).join('');if(!sessions.length)sel.innerHTML='<option value="all|00:00">Brak przerwy 6S w tym dniu</option>'}
function currentSessionAuto(){const now=new Date();document.getElementById('sessionDate').value=dateKey(now);buildSessions();const sel=document.getElementById('sessionSelect'),nowMin=now.getHours()*60+now.getMinutes();let best=Array.from(sel.options)[0];for(const o of Array.from(sel.options)){const m=minFromTime(o.value.split('|')[1]);if(nowMin>=m-2)best=o}if(best)sel.value=best.value}
async function loadTasksAndLogs(){
    const opId=document.getElementById('operatorSelect').value;
    const op=OPERATORS.find(o=>String(o.id)===String(opId));
    const [shift,start]=document.getElementById('sessionSelect').value.split('|');
    const logDate=document.getElementById('sessionDate').value;
    const dow=dayNum(new Date(logDate+'T00:00:00'));
    if(!opId){TASKS=[];LOGS={};renderTasks();setStatus('Wybierz operatora, aby zobaczyć przypisane czynności 6S.','warn');return}

    const{data,error}=await supabaseClient.from('sixs_tasks_config').select('*').eq('active',true).order('sort_order');
    if(error)throw error;
    const sessionTasks=(data||[]).filter(t=>(t.shift==='all'||t.shift===shift)&&((t.sixs_start||'all')==='all'||t.sixs_start===start)&&(!Array.isArray(t.days)||t.days.includes(dow)));
    const taskIds=sessionTasks.map(t=>t.id).filter(Boolean);

    let assignedIds=new Set();
    if(taskIds.length){
        const assignRes=await supabaseClient.from('sixs_operator_task_assignments').select('task_id,active').eq('operator_id',opId).eq('active',true).in('task_id',taskIds);
        if(assignRes.error){
            TASKS=[];LOGS={};renderTasks();
            setStatus('Nie mogę pobrać przypisań operatora. Uruchom w Supabase SQL: sixs_operator_task_assignments.sql. Szczegóły: '+assignRes.error.message,'err');
            return;
        }
        assignedIds=new Set((assignRes.data||[]).map(a=>String(a.task_id)));
    }

    TASKS=sessionTasks.filter(t=>assignedIds.has(String(t.id)));
    const res=await supabaseClient.from('sixs_task_logs').select('*').eq('log_date',logDate).eq('shift',shift).eq('sixs_start',start).eq('operator_id',opId);
    LOGS={};
    (res.data||[]).forEach(l=>LOGS[l.task_id]=l);
    renderTasks();
    const opName=op?op.operator_name:'operator';
    setStatus(`Sesja 6S: ${logDate}, zmiana ${shift}, start ${start}. Operator: ${opName}. Przypisane zadania: ${TASKS.length}.`);
}
function renderTasks(){
    const box=document.getElementById('tasksBox');
    if(!TASKS.length){
        box.innerHTML='<div class="assigned-empty">Brak czynności 6S przypisanych do wybranego operatora dla tej przerwy. Przypisz zadania w <b>config_6s.html</b> w sekcji „Przypisane zadania operatora”.</div>';
        updateSummary();
        return;
    }
    box.innerHTML=TASKS.map(t=>{
        const st=(LOGS[t.id]&&LOGS[t.id].status)||'';
        return `<div class="task"><div class="task-title">${escHtml(t.task_name)}</div><div class="task-desc">${escHtml(t.description||'')}</div><div class="task-meta">Przypisane do wybranego operatora</div><div class="buttons"><button class="done ${st==='done'?'selected':''}" onclick="setTaskStatus(${t.id},'done')">Wykonane</button><button class="skipped ${st==='skipped'?'selected':''}" onclick="setTaskStatus(${t.id},'skipped')">Pominięte</button><button class="problem ${st==='problem'?'selected':''}" onclick="setTaskStatus(${t.id},'problem')">Problem</button></div></div>`;
    }).join('');
    updateSummary();
}
function setTaskStatus(id,status){LOGS[id]=Object.assign(LOGS[id]||{},{task_id:id,status});renderTasks()}function updateSummary(){let d=0,s=0,p=0;Object.values(LOGS).forEach(l=>{if(l.status==='done')d++;if(l.status==='skipped')s++;if(l.status==='problem')p++});document.getElementById('sumDone').textContent='Wykonane: '+d;document.getElementById('sumSkipped').textContent='Pominięte: '+s;document.getElementById('sumProblem').textContent='Problem: '+p}
async function saveSixsLogs(){const opId=document.getElementById('operatorSelect').value,op=OPERATORS.find(o=>String(o.id)===String(opId));if(!op){setSave('Wybierz operatora.','err');return}const [shift,start]=document.getElementById('sessionSelect').value.split('|'),logDate=document.getElementById('sessionDate').value,comment=document.getElementById('globalComment').value.trim();const rows=TASKS.filter(t=>LOGS[t.id]&&LOGS[t.id].status).map(t=>({log_date:logDate,shift,sixs_start:start,task_id:t.id,task_name:t.task_name,operator_id:op.id,operator_name:op.operator_name,status:LOGS[t.id].status,comment,device_id:navigator.userAgent.slice(0,120),updated_at:new Date().toISOString()}));if(!rows.length){setSave('Nie zaznaczono żadnego zadania.','warn');return}const{error}=await supabaseClient.from('sixs_task_logs').upsert(rows,{onConflict:'log_date,shift,sixs_start,task_id'});if(error){setSave('Błąd zapisu: '+error.message,'err');return}setSave('Zapisano odklikanie 6S: '+rows.length+' zadań.','ok');await loadTasksAndLogs()}
async function init(){await loadBreakSchedule();await loadOperators();currentSessionAuto();document.getElementById('sessionDate').addEventListener('change',()=>{buildSessions();loadTasksAndLogs()});document.getElementById('sessionSelect').addEventListener('change',loadTasksAndLogs);document.getElementById('operatorSelect').addEventListener('change',loadTasksAndLogs);await loadTasksAndLogs()}window.onload=init;
</script></body></html>
